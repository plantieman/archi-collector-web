<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#22272B" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Archi Collector</title>
    <script type="module" crossorigin src="./assets/index-Dh4aRnrA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BvOGpS7i.css">
  </head>
  <body>
    <main class="inhalt">
      <!-- Karte: bleibt immer im Hintergrund geladen, damit der Wechsel zurück sofort geht -->
      <div id="karte"></div>

      <section class="seite seite--karte" data-seite="karte">
        <div class="leiste-oben" role="group" data-text-label="leiste.titel">
          <div class="leiste-oben__symbol" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>
          </div>
          <div class="leiste-oben__zahl"><strong id="zahl-gebaeude">·</strong><span data-text="leiste.gebaeude"></span></div>
          <div class="leiste-oben__zahl"><strong id="zahl-punkte">·</strong><span data-text="leiste.punkte"></span></div>
          <div class="leiste-oben__zahl leiste-oben__zahl--hell"><strong id="zahl-alben">·</strong><span data-text="leiste.alben"></span></div>
        </div>
        <button class="zurueck-herkunft" id="zurueck-herkunft" type="button" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          <span></span>
        </button>
        <section class="blatt" id="blatt" hidden>
          <div class="blatt__griff" aria-hidden="true"></div>
          <button class="blatt__zu" id="blatt-zu" type="button" data-text-label="blatt.schliessen">×</button>
          <div id="blatt-inhalt"></div>
        </section>
      </section>

      <section class="seite seite--voll" data-seite="sammlung" hidden>
        <h1 class="seite__titel" data-text="navi.sammlung"></h1>
        <p class="seite__unter" id="sammlung-unter"></p>
        <div class="umschalter" role="tablist">
          <button class="umschalter__knopf" type="button" role="tab" data-ansicht="alben" data-text="sammlung.alben"></button>
          <button class="umschalter__knopf" type="button" role="tab" data-ansicht="gebaeude" data-text="sammlung.gebaeude_tab"></button>
        </div>
        <div id="sammlung-alben">
          <h2 class="seite__abschnitt" data-text="sammlung.zuletzt"></h2>
          <div class="zuletzt" id="sammlung-zuletzt"></div>
          <div class="seite__abschnitt-zeile">
            <h2 class="seite__abschnitt" data-text="sammlung.meine_alben"></h2>
            <span class="seite__abschnitt-neben" data-text="sammlung.nach_fortschritt"></span>
          </div>
          <div class="seite__liste" id="alben-liste"></div>
        </div>
        <div id="sammlung-gebaeude" hidden>
          <div class="seite__liste seite__liste--abstand" id="sammlung-liste"></div>
        </div>
      </section>

      <section class="seite seite--voll seite--album" data-seite="album" hidden>
        <div class="album-kopf">
          <button class="album-kopf__zurueck" type="button" id="album-zurueck">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            <span data-text="navi.sammlung"></span>
          </button>
          <h1 class="album-kopf__titel" id="album-titel"></h1>
          <p class="album-kopf__unter" id="album-unter"></p>
          <div class="album-kopf__fortschritt">
            <div class="balken balken--dunkel"><div class="balken__fuellung" id="album-balken"></div></div>
            <strong id="album-zahl"></strong>
          </div>
          <p class="album-kopf__stufe" id="album-stufe" hidden></p>
        </div>
        <div class="filter" id="album-filter">
          <button class="filter__knopf" type="button" data-filter="alle" data-text="album.alle"></button>
          <button class="filter__knopf" type="button" data-filter="fehlen" data-text="album.fehlen"></button>
          <button class="filter__knopf" type="button" data-filter="gesammelt" data-text="album.gesammelt"></button>
        </div>
        <div class="kacheln-album" id="album-kacheln"></div>
        <p class="seite__hinweis album-hinweis" data-text="album.hinweis"></p>
      </section>

      <section class="seite seite--voll" data-seite="profil" hidden>
        <div class="profil-kopf">
          <button class="profil-bild" id="profil-bild" type="button" data-text-label="profil.bild_aendern"></button>
          <h1 class="profil-titel" id="profil-titel"></h1>
          <button class="profil-name-knopf" id="profil-name-knopf" type="button"></button>
          <p class="profil-level"><span id="profil-level"></span><span class="profil-privat" data-text="profil.privat"></span></p>
          <div class="profil-fortschritt">
            <div class="balken"><div class="balken__fuellung" id="profil-balken"></div></div>
            <p id="profil-naechstes"></p>
          </div>
        </div>
        <div class="kacheln kacheln--hell">
          <div class="kachel"><strong id="profil-gebaeude">0</strong><span data-text="leiste.gebaeude"></span></div>
          <div class="kachel"><strong id="profil-punkte">0</strong><span data-text="leiste.punkte"></span></div>
          <div class="kachel"><strong id="profil-alben">0</strong><span data-text="leiste.alben"></span></div>
        </div>
        <h2 class="seite__abschnitt" data-text="profil.stempel"></h2>
        <div class="stempel-leiste" id="profil-stempel"></div>
        <h2 class="seite__abschnitt" data-text="profil.staedte"></h2>
        <div class="staedte" id="profil-staedte"></div>
        <h2 class="seite__abschnitt" data-text="konto.bereich.titel"></h2>
        <div id="profil-konto"></div>
        <h2 class="seite__abschnitt" data-text="einstellungen.titel"></h2>
        <label class="einstellung">
          <span class="einstellung__text">
            <span data-text="einstellungen.galerie"></span>
            <small data-text="einstellungen.galerie_hinweis"></small>
          </span>
          <input type="checkbox" class="einstellung__schalter" id="einstellung-galerie">
        </label>
      </section>
    </main>

    <nav class="navi" data-text-label="navi.titel">
      <button class="navi__knopf" type="button" data-ziel="karte">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
        <span data-text="navi.karte"></span>
      </button>
      <button class="navi__knopf" type="button" data-ziel="sammlung">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5c3-1.5 7-1.5 10 1 3-2.5 7-2.5 10-1v14c-3-1.5-7-1.5-10 1-3-2.5-7-2.5-10-1z"/><path d="M12 6v14"/></svg>
        <span data-text="navi.sammlung"></span>
      </button>
      <button class="navi__knopf" type="button" data-ziel="profil">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
        <span data-text="navi.profil"></span>
      </button>
    </nav>

    <div class="problem" id="bildwahl" hidden>
      <div class="problem__karte" role="dialog" aria-modal="true" aria-labelledby="bildwahl-titel">
        <h2 class="problem__titel" id="bildwahl-titel" data-text="profil.bild_titel"></h2>
        <p class="problem__unter" data-text="profil.bild_unter"></p>
        <div class="bildwahl" id="bildwahl-liste"></div>
        <div class="problem__leiste">
          <button class="problem__knopf" id="bildwahl-zu" type="button" data-text="profil.bild_schliessen"></button>
        </div>
      </div>
    </div>

    <div class="problem" id="namewahl" hidden>
      <form class="problem__karte" id="namewahl-form" role="dialog" aria-modal="true" aria-labelledby="namewahl-titel" novalidate>
        <h2 class="problem__titel" id="namewahl-titel" data-text="profil.name_titel"></h2>
        <p class="problem__unter" data-text="profil.name_unter"></p>
        <label class="problem__feld"><span data-text="profil.name_feld"></span>
          <input class="name-feld" id="namewahl-feld" type="text" maxlength="20" autocomplete="nickname" autocapitalize="words" spellcheck="false">
        </label>
        <p class="name-fehler" id="namewahl-fehler" role="alert" hidden></p>
        <div class="problem__leiste">
          <button class="problem__knopf" id="namewahl-zu" type="button" data-text="profil.name_abbrechen"></button>
          <button class="problem__knopf problem__knopf--senden" id="namewahl-ok" type="submit" data-text="profil.name_speichern"></button>
        </div>
        <button class="name-entfernen" id="namewahl-entfernen" type="button" data-text="profil.name_entfernen" hidden></button>
      </form>
    </div>

    <div class="problem" id="konto" hidden>
      <form class="problem__karte" id="konto-form" role="dialog" aria-modal="true" aria-labelledby="konto-titel" novalidate></form>
    </div>

    <div class="meldung" id="meldung" hidden></div>
  </body>
</html>
